    <line x1="250" y1="452" x2="250" y2="572"/>
    <line x1="310" y1="372" x2="310" y2="652"/>
    <line x1="370" y1="292" x2="370" y2="732"/>
    <line x1="430" y1="402" x2="430" y2="622"/>
